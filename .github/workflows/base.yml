#### Build the base images: a distro with the minimal dependencies V needs
name: Build and deploy all base images

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/base.yml'
      - 'docker/base/Dockerfile.*'
      - 'docker/base/os/**/Dockerfile.*'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/base.yml'
      - 'docker/base/Dockerfile.*'
      - 'docker/base/os/**/Dockerfile.*'
  workflow_dispatch:

concurrency:
  group: base-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fallbacks, so that a fork (or a checkout whose repository variables have
  # never been set) builds a valid multi-platform image instead of an
  # unbuildable single-platform one. Both are overridable with repository
  # variables of the same name.
  DOCKER_REPOSITORY: ${{ vars.DOCKER_REPOSITORY || 'thevlang' }}
  PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64,linux/arm64' }}

jobs:
  resolve:
    name: Resolve the V version to label with
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vver.outputs.version }}
    steps:
      - name: Read the latest release tag from vlang/v
        id: vver
        run: |
          set -euo pipefail
          version=$(git ls-remote --tags --refs --sort=-v:refname \
            https://github.com/vlang/v 'refs/tags/[0-9]*' | head -n1 | sed 's#.*refs/tags/##')
          if [ -z "$version" ]; then
            echo "could not resolve a V release tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "V version: $version"

  deploy:
    name: Build ${{ matrix.os }}-base
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # `nix` needs no base image: /opt/vlang is a plain WORKDIR in the
        # nixos/nix base image, so the toolchain image is its first stage.
        # ubuntu-base is built by build_ubuntu.yml, which builds
        # thevlang/vlang:ubuntu-build on top of it.
        include:
          - os: alpine
            file: docker/base/Dockerfile.alpine
          - os: debian
            file: docker/base/Dockerfile.debian
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        # A docker-container driver is the only one that can build a foreign
        # architecture and keep the result as one multi-platform manifest.
        run: |
          docker buildx create --name gh-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and deploy the base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          builder: gh-builder
          platforms: ${{ env.PLATFORMS }}
          build-args: USER=${{ env.DOCKER_REPOSITORY }}
          labels: |
            org.opencontainers.image.title=${{ env.DOCKER_REPOSITORY }}/vlang:${{ matrix.os }}-base
            org.opencontainers.image.source=https://github.com/vlang/docker
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.DOCKER_REPOSITORY }}/vlang:${{ matrix.os }}-base
